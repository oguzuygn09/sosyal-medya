<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>23–30 Kasım · Instagram önizleme</title>
<style>
  :root{--bd:#dbdbdb;--mut:#737373;--link:#00376b;}
  *{box-sizing:border-box}
  body{margin:0;background:#f0f0f0;font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#000}
  .top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--bd);padding:10px 12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .top button{border:1px solid var(--bd);background:#fff;border-radius:20px;padding:7px 14px;font-weight:600;cursor:pointer}
  .top button.on{background:#000;color:#fff;border-color:#000}
  .phone{max-width:470px;margin:16px auto 60px;background:#fff;border:1px solid var(--bd);border-radius:14px;overflow:hidden}
  .ighead{display:flex;align-items:center;justify-content:center;height:48px;border-bottom:1px solid var(--bd);font-weight:700;font-size:16px}
  .prof{display:flex;gap:22px;align-items:center;padding:16px}
  .av{width:84px;height:84px;border-radius:50%;border:1px solid var(--bd);background:#fff center/72% no-repeat;flex:none}
  .av.sm{width:32px;height:32px}
  .pname{font-weight:700;font-size:15px}.psub{color:var(--mut);font-size:13px;margin-top:2px}
  .vt{display:flex;border-top:1px solid var(--bd)}
  .vt div{flex:1;text-align:center;padding:10px;cursor:pointer;color:var(--mut);font-weight:600;font-size:13px}
  .vt div.on{color:#000;border-top:1px solid #000;margin-top:-1px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
  .tile{position:relative;aspect-ratio:4/5;background:#eee center/cover no-repeat;cursor:pointer}
  .tile .ic{position:absolute;top:8px;right:8px;width:20px;height:20px;filter:drop-shadow(0 0 2px rgba(0,0,0,.5))}
  .tile .dt{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:2px 6px;border-radius:4px}
  .post{border-bottom:1px solid var(--bd);padding-bottom:10px}
  .ph{display:flex;align-items:center;gap:10px;padding:10px 12px}
  .ph b{font-size:14px}.ph .sch{margin-left:auto;font-size:12px;color:#fff;background:#0095f6;padding:3px 8px;border-radius:10px}
  .media{position:relative;background:#000}
  .slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
  .slides::-webkit-scrollbar{display:none}
  .slides img{width:100%;flex:none;scroll-snap-align:start;display:block;aspect-ratio:4/5;object-fit:cover}
  .cnt{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.7);color:#fff;font-size:12px;padding:3px 9px;border-radius:12px}
  .dots{display:flex;justify-content:center;gap:4px;padding:8px 0 0}
  .dots i{width:6px;height:6px;border-radius:50%;background:#c7c7c7}.dots i.on{background:#0095f6}
  video{width:100%;display:block;aspect-ratio:9/16;object-fit:cover;max-height:760px}
  .snd{position:absolute;bottom:12px;right:12px;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer}
  .act{display:flex;gap:16px;padding:8px 12px 4px}.act svg{width:24px;height:24px}.act .sv{margin-left:auto}
  .cap{padding:2px 12px;white-space:pre-wrap;word-wrap:break-word}
  .cap .tg{color:var(--link)}
  .note{padding:4px 12px;color:var(--mut);font-size:12px}
  .legend{max-width:470px;margin:0 auto;color:var(--mut);font-size:12px;text-align:center;padding:0 12px}
</style>
</head>
<body>
<div class="top" id="accs"></div>
<p class="legend">Önizleme · Instagram'da nasıl görüneceği. Kaydırmalı postlarda sağa kaydırın, Reels'te sesi açmak için hoparlöre dokunun.</p>
<div class="phone">
  <div class="ighead" id="uname"></div>
  <div class="prof"><div class="av" id="av"></div><div><div class="pname" id="pname"></div><div class="psub">23–30 Kasım planı</div></div></div>
  <div class="vt"><div id="tg" class="on">▦ Profil ızgarası</div><div id="tf">☰ Akış</div></div>
  <div id="view"></div>
</div>
<script>
const SVG={
 car:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M19 3H8a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zM4 7H3v12a2 2 0 0 0 2 2h12v-1H5a1 1 0 0 1-1-1z"/></svg>',
 reel:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M4 3h16a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm6 6v6l5-3z"/></svg>',
 heart:'<svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2"><path d="M12 21s-7.5-4.6-9.5-9.3C1 8 3.2 4.5 6.6 4.5c2 0 3.5 1.1 5.4 3.1 1.9-2 3.4-3.1 5.4-3.1 3.4 0 5.6 3.5 4.1 7.2C19.5 16.4 12 21 12 21z"/></svg>',
 com:'<svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2"><path d="M20.7 16.5A9 9 0 1 0 17 20.3L21 21z"/></svg>',
 shr:'<svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2"><path d="M22 3 9.2 10.1M22 3l-7 18-4-8-8-4z"/></svg>',
 sav:'<svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2"><path d="M19 21l-7-6-7 6V3h14z"/></svg>'};
let D,acc='neopolistravel',mode='grid';
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const tagify=s=>esc(s).replace(/(^|\s)(#\w+)/g,'$1<span class="tg">$2</span>');
function head(){
  document.getElementById('accs').innerHTML=Object.keys(D).map(k=>`<button class="${k==acc?'on':''}" onclick="acc='${k}';mode='grid';draw()">@${k}</button>`).join('');
  const a=D[acc]; document.getElementById('uname').textContent=acc; document.getElementById('pname').textContent=a.name;
  document.getElementById('av').style.backgroundImage=`url(${a.logo})`;
  document.getElementById('tg').className=mode=='grid'?'on':''; document.getElementById('tf').className=mode=='feed'?'on':'';
}
function draw(){
  head(); const a=D[acc]; const ps=a.posts.slice().reverse(); const v=document.getElementById('view');
  if(mode=='grid'){
    v.innerHTML='<div class="grid">'+ps.map((p,i)=>{const bg=p.kind=='reel'?p.cover:p.imgs[0];
      const ic=p.kind=='reel'?SVG.reel:(p.kind=='carousel'?SVG.car:'');
      return `<div class="tile" style="background-image:url('${bg}')" onclick="mode='feed';draw();setTimeout(()=>document.getElementById('p${i}').scrollIntoView({behavior:'smooth'}),50)">${ic?`<span class="ic">${ic}</span>`:''}<span class="dt">${p.day}</span></div>`}).join('')+'</div>';
  } else {
    v.innerHTML=ps.map((p,i)=>{let m;
      if(p.kind=='reel') m=`<div class="media"><video src="${p.video}" poster="${p.cover}" autoplay muted loop playsinline></video><div class="snd" onclick="const vv=this.previousElementSibling;vv.muted=!vv.muted;this.textContent=vv.muted?'🔇':'🔊'">🔇</div></div>`;
      else m=`<div class="media"><div class="slides" onscroll="dots(this)">${p.imgs.map(s=>`<img src="${s}" loading="lazy">`).join('')}</div>${p.imgs.length>1?`<span class="cnt">1/${p.imgs.length}</span>`:''}</div>`+(p.imgs.length>1?`<div class="dots">${p.imgs.map((_,j)=>`<i class="${j?'':'on'}"></i>`).join('')}</div>`:'');
      return `<div class="post" id="p${i}"><div class="ph"><div class="av sm" style="background-image:url(${a.logo})"></div><b>${acc}</b><span class="sch">${p.day} · ${p.time}</span></div>${m}
      <div class="act">${SVG.heart}${SVG.com}${SVG.shr}<span class="sv">${SVG.sav}</span></div>
      <div class="cap"><b>${acc}</b> ${tagify(p.cap)}\n\n${tagify(p.tags)}</div>
      <div class="note">${p.kind=='reel'?'Reels · Edits uygulamasından trend sesle paylaşılacak (20 dk önce hatırlatma)':'Otomatik paylaşım · Windsor'}</div></div>`}).join('');
  }
}
function dots(el){const n=el.children.length,i=Math.round(el.scrollLeft/el.clientWidth);const md=el.parentNode;md.querySelector('.cnt').textContent=(i+1)+'/'+n;
  md.nextElementSibling.querySelectorAll('i').forEach((d,j)=>d.className=j==i?'on':'')}
document.getElementById('tg').onclick=()=>{mode='grid';draw()}; document.getElementById('tf').onclick=()=>{mode='feed';draw()};
fetch('data.json').then(r=>r.json()).then(j=>{D=j;draw()});
</script>
</body>
</html>
